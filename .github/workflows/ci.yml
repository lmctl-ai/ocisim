name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, name: linux-x64, ext: ''}
          - {os: ubuntu-24.04-arm, name: linux-arm64, ext: ''}
          - {os: macos-15, name: macos-arm64, ext: ''}
          - {os: macos-15-intel, name: macos-x64, ext: ''}
          - {os: windows-2022, name: windows-x64, ext: '.exe'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: maven-cache
        with:
          path: |
            ~/.m2/repository
            .cache
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential zlib1g-dev
      - name: Install OCI CLI on Linux
        if: runner.os == 'Linux'
        run: python -m pip install --quiet oci-cli==3.89.3
      - name: Build native executable from verified source
        run: python scripts/build.py --native
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.maven-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.m2/repository
            .cache
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}
      - name: Verify CLI and OCI service lifecycles
        run: |
          python scripts/test-cli.py "$PWD/dist/ocisim${{ matrix.ext }}"
          python scripts/test-integration.py "$PWD/dist/ocisim${{ matrix.ext }}"
      - name: Stage release binary
        run: mv 'dist/ocisim${{ matrix.ext }}' 'dist/ocisim-${{ matrix.name }}${{ matrix.ext }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binary-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          cp LICENSE FLOCI-LICENSE upstream.lock.json dist/
          cd dist
          test "$(find . -maxdepth 1 -type f -name 'ocisim-*' | wc -l)" -eq 5
          sha256sum ocisim-* LICENSE FLOCI-LICENSE upstream.lock.json > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --repo "$GITHUB_REPOSITORY" --title "ocisim $GITHUB_REF_NAME" --notes 'Standalone local OCI emulator powered by pinned floci-oci 0.5.0. Object Storage, Identity, Queue, multi-tenancy isolation, and persistence lifecycle tests run against every binary.'
